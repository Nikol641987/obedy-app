name: Test automatickeho menu

on:
  workflow_dispatch:

jobs:
  test-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie repozitara
        uses: actions/checkout@v4

      - name: Instalacia Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacia Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-slk

      - name: Test Tesseract
        run: |
          tesseract --version
          tesseract --list-langs
