name: Automaticke nacitanie menu

on:
  workflow_dispatch:

jobs:
  import-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie repozitara
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalacia Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-slk

      - name: Spustenie importu menu
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node scripts/import-menu.js
