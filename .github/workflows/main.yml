name: Automaticke nacitanie menu

# Skript (scripts/import-menu.js) je idempotentny - ak uz je menu na dany
# tyzden ulozene v Supabase, beh sa hned skonci bez zmeny. Preto je bezpecne
# mat viac pokusov/casov v rovnakom tyzdni - realne zapise iba ten prvy,
# ktoremu sa podari najst spravne menu na superobed.sk.
#
# GitHub Actions cron pouziva vzdy UTC a nepozna letny/zimny cas, preto je
# nedelny cas 15:00 na Slovensku pokryty dvoma riadkami (CEST aj CET).
# GitHub navyse negarantuje presne spustenie naplanovanej akcie - pri nizsej
# aktivite repozitara moze byt spustenie oneskorene aj o niekolko hodin,
# preto su tu aj nasledne "zalozne" pokusy v ten isty den.
on:
  schedule:
    - cron: '7 13 * * 5'   # piatok ~13:07 UTC - skory pokus (menu casto este nie je na webe)
    - cron: '7 13 * * 0'   # nedela 13:07 UTC = 15:07 na Slovensku (letny cas, CEST, UTC+2)
    - cron: '7 14 * * 0'   # nedela 14:07 UTC = 15:07 na Slovensku (zimny cas, CET, UTC+1)
    - cron: '7 15 * * 0'   # nedela 15:07 UTC - zalozny pokus (pre pripad oneskoreneho spustenia)
    - cron: '7 17 * * 0'   # nedela 17:07 UTC - dalsi zalozny pokus
  workflow_dispatch:

jobs:
  import-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie repozitara
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalacia pdf-parse
        run: npm install --no-save pdf-parse@1.1.1

      - name: Spustenie importu menu
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/import-menu.js
