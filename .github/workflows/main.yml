name: Automaticke nacitanie menu

on:
  schedule:
    - cron: '0 13 * * 5'   # piatok 13:00 UTC (14:00 alebo 15:00 na Slovensku)
    - cron: '0 16 * * 0'   # nedela 16:00 UTC (posledny pokus, pri neuspechu pride upozornenie)
  workflow_dispatch:

jobs:
  import-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie repozitara
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalacia pdf-parse
        run: npm install --no-save pdf-parse@1.1.1

      - name: Spustenie importu menu
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/import-menu.js
