name: Import Menu to Supabase

on:
  schedule:
    # Posledný záložný pokus, ak by sa nepodarilo načítať menu už cez
    # nedeľné spustenia v main.yml (skript je idempotentný, takže sa nič
    # neprepíše, ak je menu už uložené).
    - cron: '13 6 * * 1'
  workflow_dispatch: # Umožní spustiť skript aj ručne tlačidlom

jobs:
  import-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inštalácia závislostí
        run: npm install

      - name: Spustenie importu menu
        run: node scripts/import-menu.js
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
